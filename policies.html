<link rel="canonical" href="https://naqsh-hotel.vercel.app/policies.html">
<meta name="theme-color" content="#0a1a2c">
<link rel="icon" type="image/png" href="assets/img/favicon.png">

<body data-title="nav.policies" data-desc="pol.metaDesc">
<header id="site-header" class="site-header"></header>
<main id="main" class="page-plain">
  <section class="section" style="padding-top:20px">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow" data-i18n="nav.policies"></span>
        <h1 data-i18n="pol.h1"></h1>
        <p class="lead" data-i18n="pol.updated"></p>
      </div>
      <div class="policy-layout">
        <nav class="toc" aria-label="Contents">
          <a href="#cancellation" data-i18n="pol.cancel"></a>
          <a href="#privacy" data-i18n="pol.privacy"></a>
          <a href="#terms" data-i18n="pol.terms"></a>
          <a href="#house" data-i18n="pol.house"></a>
        </nav>
        <div class="prose">
          <section id="cancellation"><h2 data-i18n="pol.cancel"></h2><div data-i18n-html="pol.cancel.body"></div></section>
          <section id="privacy"><h2 data-i18n="pol.privacy"></h2><div data-i18n-html="pol.privacy.body"></div></section>
          <section id="terms"><h2 data-i18n="pol.terms"></h2><div data-i18n-html="pol.terms.body"></div></section>
          <section id="house" style="border:0"><h2 data-i18n="pol.house"></h2><div data-i18n-html="pol.house.body"></div></section>

    </div>
  </section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="assets/js/data.js?v=202610251850"></script>
<script src="assets/js/i18n.js?v=202610251850"></script>
<script src="assets/js/app.js?v=202610251850"></script>
<script>
(function () {
  var links = document.querySelectorAll('.toc a');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting) links.forEach(function (a) { a.classList.toggle('is-active', a.getAttribute('href') === '#' + e.target.id); });
      });
    }, { rootMargin: '-30% 0px -60% 0px' });
    document.querySelectorAll('.prose section').forEach(function (s) { io.observe(s); });
  }
  window.NAQSH.onRender(function () { if (location.hash) { var el = document.querySelector(location.hash); if (el) setTimeout(function () { el.scrollIntoView(); }, 50); } });
})();
</script>
</body>
</html>
