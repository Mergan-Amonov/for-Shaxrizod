<script>
(function () {
  var N = window.NAQSH, D = window.NAQSH_DATA;
  var USP = [['pattern', 'usp.1'], ['smart', 'usp.2'], ['breakfast', 'usp.3'], ['laptop', 'usp.4'], ['receipt', 'usp.5'], ['car', 'usp.6']];
  N.onRender(function () {
    N.bookingWidget('#hero-widget');
    document.getElementById('usp-grid').innerHTML = USP.map(function (u) {
      return '<div class="usp reveal"><div class="usp-icon">' + N.icon(u[0]) + '</div><h3>' + N.t(u[1] + '.t') + '</h3><p>' + N.t(u[1] + '.p') + '</p></div>';
    }).join('');
    document.getElementById('rooms-grid').innerHTML = D.rooms.map(N.roomCard).join('');
    document.getElementById('offers-grid').innerHTML = D.offers.map(function (o) {
      return '<article class="offer reveal"><img src="' + N.img(o.img, true) + '" alt="" loading="lazy" width="800" height="533"><div class="offer-body"><span class="offer-badge">' + o.badge + '</span><h3>' + N.esc(N.L(o.title)) + '</h3><p>' + N.esc(N.L(o.text)) + '</p><a class="link" href="booking.html?offer=' + o.id + '">' + N.t('offers.cta') + '</a></div></article>';
    }).join('');
    var c = D.contact;
    document.getElementById('cta-actions').innerHTML =
      '<a class="btn btn--wa" href="' + c.whatsapp + '" target="_blank" rel="noopener">' + N.icon('whatsapp') + 'WhatsApp</a>' +
      '<a class="btn btn--tg" href="' + c.telegram + '" target="_blank" rel="noopener">' + N.icon('telegram') + 'Telegram</a>' +
      '<a class="btn btn--navy" href="' + c.phoneHref + '">' + N.icon('phone') + c.phone + '</a>';
  });

  // Hero slideshow
  var slides = document.querySelectorAll('.hero-slide'), dots = document.querySelectorAll('.hero-dots button'), cur = 0, timer;
  function go(i) {
    slides[cur].classList.remove('is-active'); dots[cur].classList.remove('is-active');
    cur = (i + slides.length) % slides.length;
    slides[cur].classList.add('is-active'); dots[cur].classList.add('is-active');
  }
  function play() { clearInterval(timer); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(function () { go(cur + 1); }, 6500); }
  dots.forEach(function (d, i) { d.addEventListener('click', function () { go(i); play(); }); });
  play();
})();
</script>
